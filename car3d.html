<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RL Racing: car and observation (three.js)</title>
  <link rel="stylesheet" href="./theme/theme.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--rlr-bg); color: var(--rlr-text); font-family: var(--rlr-font); }
    #app { position: relative; width: 100vw; height: 100vh; }
    #app canvas { display: block; }
    .la-label { font: 600 13px/1.1 var(--rlr-mono); text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; transition: opacity .25s; }
    .la-label.small { font-size: 12px; font-weight: 500; }
    .la-label.action { font-size: 13px; background: rgba(11,15,20,.75); padding: 3px 7px; border-radius: 6px; border: 1px solid var(--rlr-b6); }
    .la-label.dim { opacity: .12; }
    .la-label.hidden { display: none; }
    #overlay { position: absolute; top: 14px; left: 16px; max-width: 520px; pointer-events: none; }
    #overlay .ttl { font-weight: 700; font-size: 18px; letter-spacing: .01em; }
    #overlay .sub { color: var(--rlr-text-muted); font-size: 12.5px; font-family: var(--rlr-mono); margin-top: 3px; }
    #overlay .blk { display: none; margin-top: 10px; background: rgba(22,29,39,.85); border-left: 4px solid; padding: 8px 12px; border-radius: 6px; font-size: 14px; line-height: 1.35; backdrop-filter: blur(4px); }
    #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 400px; overflow-y: auto; padding: 12px 12px 12px 10px; box-sizing: border-box;
             background: linear-gradient(90deg, rgba(11,15,20,0) 0, rgba(11,15,20,.92) 28px); scrollbar-width: thin; }
    .panel-title { font-size: 14px; margin: 2px 0 8px 6px; }
    .panel-title span { color: var(--rlr-text-muted); font-size: 12px; margin-left: 6px; }
    .card { --c: #888; background: var(--rlr-panel); border: 1px solid var(--rlr-panel-border); border-left: 4px solid var(--c); border-radius: 8px;
            padding: 7px 9px 6px; margin: 0 0 7px 6px; cursor: pointer; transition: opacity .25s, box-shadow .25s; }
    .card.dim { opacity: .3; }
    .card.hot { box-shadow: 0 0 0 1px var(--c), 0 0 18px -4px var(--c); }
    .card header { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; margin-bottom: 5px; }
    .card header .idx { font-family: var(--rlr-mono); color: var(--c); font-weight: 700; }
    .card header .name { font-weight: 600; }
    .card header .div { margin-left: auto; font-family: var(--rlr-mono); color: var(--rlr-text-muted); font-size: 11.5px; }
    .grid { display: grid; gap: 3px 6px; }
    .grid.wide { grid-template-columns: repeat(5, 1fr); }
    .grid.narrow { grid-template-columns: repeat(3, 1fr); }
    .cell { display: flex; justify-content: space-between; font-family: var(--rlr-mono); font-size: 11.5px; background: rgba(0,0,0,.25); padding: 2px 5px; border-radius: 4px; }
    .cell .lbl { color: var(--rlr-text-muted); }
    .cell .val { color: var(--rlr-text); font-variant-numeric: tabular-nums; }
    .desc { margin: 6px 0 0; font-size: 11.5px; color: var(--rlr-text-muted); line-height: 1.3; }
    .help { font-size: 11px; color: var(--rlr-text-muted); margin: 6px 0 0 6px; }
    body.no-info #overlay { display: none !important; }
    body.no-hud #overlay, body.no-hud #panel, body.no-hud .la-label { display: none !important; }
    kbd { font-family: var(--rlr-mono); background: #222a35; border: 1px solid #36425a; border-radius: 3px; padding: 0 4px; font-size: 10.5px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./three/main.js"></script>
</body>
</html>
